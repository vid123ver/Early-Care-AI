services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: earlycare-backend
    ports:
      - "5002:5002"
    environment:
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/}
      - JWT_SECRET=${JWT_SECRET:-change_me_to_a_long_random_secret_key}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models:/app/models
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: earlycare-frontend
    ports:
      - "5177:80"
    environment:
      - BACKEND_UPSTREAM=http://backend:5002
    depends_on:
      - backend

  mongo:
    image: mongo:7
    container_name: earlycare-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
